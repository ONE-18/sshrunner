services:
  sshrunner:
    build: .
    container_name: sshrunner
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sshrunner-data:/app/data
      # Solo lectura: las claves nunca se escriben en el contenedor.
      - ${HOME}/.ssh:/run/ssh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/state')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sshrunner-data:
